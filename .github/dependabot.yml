version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: 'composer'
    directory: '/examples/sanity-test'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
