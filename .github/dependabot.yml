version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - 'rudderlabs/*'
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions:
        patterns: ['*']
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ['*']
      composer-deps:
        patterns: ['*']
  - package-ecosystem: 'composer'
    directory: '/examples/sanity-test'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ['*']
      composer-deps:
        patterns: ['*']
