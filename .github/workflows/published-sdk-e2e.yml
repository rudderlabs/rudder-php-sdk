name: Published PHP SDK E2E

on:
  release:
    types: [published]
  # Retry validation at an existing release tag. This workflow cannot publish.
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel live validation; the central workflow owns locking and cleanup.
jobs:
  validate:
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: rudderlabs/github-action-sdk-e2e/.github/workflows/published-sdk-e2e.yml@b6de40cc65abe8ee6c6593aac1787aea746b671f # v1.0.0
    with:
      package-version: ${{ github.event.release.tag_name || github.ref_name }}
      release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-release:
    name: Notify release acceptance
    needs: validate
    if: always() && github.event_name == 'release' && !github.event.release.prerelease && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      CENTRAL_RUN_URL: ${{ needs.validate.outputs.run-url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Prepare release status
        id: status
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          release_date=$(python3 -c 'import datetime, os; print(datetime.datetime.fromisoformat(os.environ["RELEASE_PUBLISHED_AT"].replace("Z", "+00:00")).date())')
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            RELEASE_VERSION='unverified release tag'
          fi
          if [[ "$VALIDATION_RESULT" == success ]]; then
            result='accepted'
            checks='Exact Packagist version/reference, full delivery, and cleanup: passed.'
          else
            result='published; validation failed or incomplete'
            checks='Exact Packagist version/reference, full delivery, or cleanup: failed or incomplete. Inspect the validation run.'
          fi
          echo "root=PHP SDK $RELEASE_VERSION $result ($release_date). CC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          printf 'PHP SDK %s: %s\n%s\nCentral E2E: %s\n' "$RELEASE_VERSION" "$result" "$checks" "$CENTRAL_RUN_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send release status to Slack channel
        id: slack
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: |
            {
              "text": ${{ toJSON(steps.status.outputs.root) }},
              "unfurl_links": false,
              "unfurl_media": false
            }

      - name: Require the release message timestamp
        env:
          THREAD_TS: ${{ steps.slack.outputs.ts }}
        run: |
          if [[ ! "$THREAD_TS" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo 'Slack root message returned no valid timestamp.' >&2
            exit 1
          fi

      - name: Reply with links and check results
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: |
            {
              "thread_ts": "${{ steps.slack.outputs.ts }}",
              "reply_broadcast": false,
              "text": ${{ toJSON(format('Release: <{0}|{1}> | <https://packagist.org/packages/rudderstack/rudder-php-sdk|Packagist> | <{2}/{3}/actions/runs/{4}|Validation run> | {5} | Central E2E: {6}', github.event.release.html_url, steps.status.outputs.version, github.server_url, github.repository, github.run_id, steps.status.outputs.checks, needs.validate.outputs.run-url)) }},
              "unfurl_links": false,
              "unfurl_media": false
            }
